name: Feature request
description: Suggest something this kit should cover that it doesn't today.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        What reliability gap are you working around today? Note that
        vendor-specific adapters (Slack, Telegram, PagerDuty, ...) are a
        deliberate non-goal — see "Deliberately not included" in the
        README — so a proposal in that direction needs a reason the
        generic webhook contract can't cover.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
    validations:
      required: false
